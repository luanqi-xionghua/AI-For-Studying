# Builds the Windows desktop app (开智) for a `desktop-vX.Y.Z` tag and publishes the
# GitHub Release that the in-app updater reads. A push to main whose desktop version
# has no tag yet creates that tag here first, so merging a version bump releases it. Tags with a pre-release suffix
# (desktop-v0.3.0-beta.1) become GitHub pre-releases, offered only to testers.
# Extension tags (vX.Y.Z) do not match and are never built here.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的标签，例如 desktop-v0.3.0 或 desktop-v0.3.0-beta.1
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Decides which tag to build. On main it tags the commit when frontend/package.json
  # has a version without a tag; tags pushed with GITHUB_TOKEN do not start this
  # workflow again, so the build runs below in the same run.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'

      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="desktop-v$(node -p "require('./frontend/package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag 已发布，跳过"
              tag=""
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Check tag and versions
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content backend/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content backend/Cargo.toml -Raw), '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -cne "desktop-v$version") { throw "标签 $env:RELEASE_TAG 与 frontend/package.json 的版本 $version 不一致" }
          if ($tauri -cne $version -or $cargo -cne $version) { throw "package.json ($version)、tauri.conf.json ($tauri) 与 Cargo.toml ($cargo) 的版本必须一致" }
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
          "DESKTOP_PRERELEASE=$($version.Contains('-'))" >> $env:GITHUB_ENV

      - name: Build Windows Codex helper
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-host.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Helper build failed' }

      - name: Install desktop dependencies
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          # Copies the helper into backend/resources, which the Rust build script requires.
          node scripts/prepare-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preparing assets failed' }

      - name: Test
        working-directory: frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript tests failed' }
          cargo test --manifest-path ../backend/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }

      - name: Build installer
        working-directory: frontend
        run: npm run desktop:build

      - name: Package release assets
        working-directory: frontend
        run: |
          npm run package:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          node scripts/release-assets.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release assets failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: kaizhi-${{ env.DESKTOP_VERSION }}
          path: frontend/release/github/
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem frontend/release/github -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-running the workflow replaces the assets; title and notes stay as edited.
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $title = "开智 $env:DESKTOP_VERSION · Windows 桌面版"
            # Release notes come from the matching "## 开智 X.Y.Z" section of docs/CHANGELOG.md.
            $notes = Join-Path $env:RUNNER_TEMP "release-notes-$env:DESKTOP_VERSION.md"
            node scripts/release-notes.mjs $env:DESKTOP_VERSION $notes
            $hasNotes = $LASTEXITCODE -eq 0
            $arguments = @('release', 'create', $env:RELEASE_TAG) + $assets + @('--verify-tag', '--title', $title)
            if ($hasNotes) { $arguments += @('--notes-file', $notes) } else { $arguments += '--generate-notes' }
            if ($env:DESKTOP_PRERELEASE -eq 'True') { $arguments += '--prerelease' } else { $arguments += '--latest' }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed' }
